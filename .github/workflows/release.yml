name: Verify and publish KiWeave Beta 5

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact Beta 5 draft release tag containing the locally verified WPF package
        required: true
        default: v1.0.0-beta.5
        type: string
      publish:
        description: Publish the already-uploaded and verified draft as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-prebuilt-beta5:
    runs-on: windows-latest
    outputs:
      label: ${{ steps.version.outputs.label }}
    permissions:
      contents: read
    steps:
      - name: Check out public verification tools
        uses: actions/checkout@v4

      - name: Read and validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = '1.0.0-beta.5'
          if ($env:RELEASE_TAG -cne "v$version") { throw "Release tag must be v$version." }
          $label = $version -replace '[^A-Za-z0-9-]', '-'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "label=$label" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download and verify the exact prebuilt draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_LABEL: ${{ steps.version.outputs.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $json = gh api "repos/$repo/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the Beta 5 draft release.' }
          $draft = ConvertFrom-Json -InputObject $json
          if ($draft.tag_name -cne $tag -or -not $draft.draft) { throw "Publishing requires an existing draft release for $tag." }
          $expected = @("KiWeave-Setup-beta5-$env:BUILD_LABEL.exe", "KiWeave-Portable-beta5-$env:BUILD_LABEL.zip", 'SHA256SUMS.txt')
          $actual = @($draft.assets | ForEach-Object name)
          if ($actual.Count -ne 3 -or @($actual | Where-Object { $_ -notin $expected }).Count -gt 0 -or @($expected | Where-Object { $_ -notin $actual }).Count -gt 0) { throw 'Draft assets must exactly match the locally verified Beta 5 package and checksum manifest.' }
          $package = Join-Path $env:GITHUB_WORKSPACE 'release\prebuilt-beta5'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          gh release download $tag --repo $repo --dir $package --pattern $expected[0] --pattern $expected[1] --pattern $expected[2]
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact Beta 5 draft assets.' }
          & ./tools/VerifyReleaseArtifact.ps1 -PackageDirectory $package -BuildLabel $env:BUILD_LABEL
          if ($LASTEXITCODE -ne 0) { throw 'The downloaded Beta 5 package did not pass verification.' }
          'Verified locally built WPF package assets. WPF source remains private; this job did not rebuild or upload binaries.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  publish-beta5:
    if: ${{ inputs.publish }}
    needs: verify-prebuilt-beta5
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out public verification tools
        uses: actions/checkout@v4

      - name: Reverify and publish the exact draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_LABEL: ${{ needs.verify-prebuilt-beta5.outputs.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $json = gh api "repos/$repo/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not re-read the Beta 5 draft release.' }
          $draft = ConvertFrom-Json -InputObject $json
          if ($draft.tag_name -cne $tag -or -not $draft.draft) { throw 'The Beta 5 release is no longer a draft; refusing to publish.' }
          $expected = @("KiWeave-Setup-beta5-$env:BUILD_LABEL.exe", "KiWeave-Portable-beta5-$env:BUILD_LABEL.zip", 'SHA256SUMS.txt')
          $actual = @($draft.assets | ForEach-Object name)
          if ($actual.Count -ne 3 -or @($actual | Where-Object { $_ -notin $expected }).Count -gt 0 -or @($expected | Where-Object { $_ -notin $actual }).Count -gt 0) { throw 'Draft assets changed after verification; refusing to publish.' }
          $assetStamp = @($draft.assets | Sort-Object name | ForEach-Object { "$($_.id)|$($_.name)|$($_.size)|$($_.updated_at)" }) -join "`n"
          $package = Join-Path $env:GITHUB_WORKSPACE 'release\prebuilt-beta5'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          gh release download $tag --repo $repo --dir $package --pattern $expected[0] --pattern $expected[1] --pattern $expected[2]
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact Beta 5 draft assets.' }
          & ./tools/VerifyReleaseArtifact.ps1 -PackageDirectory $package -BuildLabel $env:BUILD_LABEL
          if ($LASTEXITCODE -ne 0) { throw 'The Beta 5 assets failed the final hash check.' }
          $updatedJson = gh api "repos/$repo/releases/$($draft.id)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not re-read the draft before publishing.' }
          $updated = ConvertFrom-Json -InputObject $updatedJson
          $updatedAssets = @($updated.assets | ForEach-Object name)
          $updatedStamp = @($updated.assets | Sort-Object name | ForEach-Object { "$($_.id)|$($_.name)|$($_.size)|$($_.updated_at)" }) -join "`n"
          if (-not $updated.draft -or $updatedAssets.Count -ne 3 -or @($updatedAssets | Where-Object { $_ -notin $expected }).Count -gt 0 -or @($expected | Where-Object { $_ -notin $updatedAssets }).Count -gt 0 -or $assetStamp -cne $updatedStamp) { throw 'Draft assets changed during verification; the release remains a draft.' }
          gh release edit $tag --draft=false --prerelease --title "KiWeave $tag"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub could not publish the validated draft.' }
          "Published $tag from the locally verified WPF package." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

