name: Build and release KiWeave

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Run native keyboard-hook tests
        shell: pwsh
        run: ./bin/KiWeave.Tests.exe --native

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\KeyWeave.iss'

      - name: Build portable package and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\portable | Out-Null
          Copy-Item bin\KiWeave.exe, bin\UninstallKiWeave.exe, LICENSE, NOTICE, README.md, CHANGELOG.md release\portable\
          Compress-Archive -Path release\portable\* -DestinationPath release\KiWeave-Portable-1.0.0-beta.3.zip -Force
          Get-ChildItem release\KiWeave-Setup-1.0.0-beta.3.exe, release\KiWeave-Portable-1.0.0-beta.3.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release\SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiWeave-1.0.0-beta.3
          path: |
            release/KiWeave-Setup-1.0.0-beta.3.exe
            release/KiWeave-Portable-1.0.0-beta.3.zip
            release/SHA256SUMS.txt

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/KiWeave-Setup-1.0.0-beta.3.exe release/KiWeave-Portable-1.0.0-beta.3.zip release/SHA256SUMS.txt --title "KiWeave ${{ github.ref_name }}" --prerelease --generate-notes
